<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Reddit Checker</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>

<!-- icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-reddit" viewBox="0 0 32 32">
    <ellipse cx="16" cy="19.4" rx="11.2" ry="8.4"/>
    <circle cx="4.6" cy="18.2" r="3.4"/>
    <circle cx="27.4" cy="18.2" r="3.4"/>
    <path d="M15 11.6 16.9 4l6.1 1.3-.42 1.96-4.14-.89-1.48 5.9z"/>
    <circle cx="23.4" cy="4.9" r="2.9"/>
  </symbol>
  <symbol id="i-reddit-face" viewBox="0 0 32 32">
    <circle cx="11.4" cy="18.6" r="2.3"/>
    <circle cx="20.6" cy="18.6" r="2.3"/>
    <path d="M10.4 23.4a.95.95 0 0 1 1.34-.06A6.6 6.6 0 0 0 16 24.8a6.6 6.6 0 0 0 4.26-1.46.95.95 0 1 1 1.28 1.4A8.5 8.5 0 0 1 16 26.7a8.5 8.5 0 0 1-5.54-1.96.95.95 0 0 1-.06-1.34z"/>
  </symbol>
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1 1 0 0 1 1.5 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-ref" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16V4a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M11 5h10"/><path d="M11 12h7"/><path d="M11 19h4"/><path d="m3 8 3-3 3 3"/><path d="M6 5v14"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M12 2v6"/><path d="M5.6 5.6a9 9 0 1 0 12.8 0"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>
</svg>

<header class="hdr">
  <div class="mark" aria-hidden="true">
    <svg class="snoo" viewBox="0 0 32 32"><use href="#i-reddit"/></svg>
    <svg class="snoo-face" viewBox="0 0 32 32"><use href="#i-reddit-face"/></svg>
  </div>
  <div class="lockup">
    <div class="wordmark" id="ctx-title">Reddit Checker</div>
    <div class="wordsub" id="ctx-sub">misinformation &amp; sentiment</div>
  </div>
  <div class="hdr-actions">
    <div class="conn" id="conn" role="status" aria-live="polite">
      <span class="dot wait" id="conn-dot"></span><span id="conn-text">Checking…</span>
    </div>
    <button class="icbtn" id="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch theme">
      <svg aria-hidden="true"><use href="#i-sun" id="theme-icon"/></svg>
    </button>
  </div>
</header>
<div class="rule"></div>

<main class="scroll" id="main" aria-live="polite" aria-busy="false"></main>
<footer class="foot" id="foot"></footer>

<script src="popup.js"></script>
</body>
</html>
